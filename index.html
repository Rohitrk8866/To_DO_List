<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <style>
        /* CSS: Design */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 350px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h2 { text-align: center; color: #333; }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            outline: none;
        }

        button {
            padding: 10px 15px;
            background-color: #764ba2;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover { background-color: #5a357a; }

        ul { list-style: none; padding: 0; }

        li {
            background: #f4f4f4;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 5px solid #764ba2;
        }

        .delete-btn {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>My To-Do List</h2>
        
        <!-- Input aur Button -->
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Naya kaam likh oe...">
            <button id="addBtn">Add</button>
        </div>

        <!-- Yahan tasks ki list aayegi -->
        <ul id="taskList"></ul>
    </div>

    <!-- JavaScript: DOM Manipulation -->
    <script>
        // 1. Elements ko pakdo
        const taskInput = document.getElementById('taskInput');
        const addBtn = document.getElementById('addBtn');
        const taskList = document.getElementById('taskList');

        // 2. Add Button par click event lagao
        addBtn.addEventListener('click', function() {
            
            // Input box se text lo
            const taskText = taskInput.value;

            // Agar input khaali hai, toh kuch mat karo
            if (taskText === '') {
                alert("Pehle kuch likho toh sahi!");
                return;
            }

            // 3. Naya <li> element banao
            const li = document.createElement('li');
            li.innerText = taskText;

            // 4. Delete button banao
            const deleteBtn = document.createElement('button');
            deleteBtn.innerText = 'Delete';
            deleteBtn.classList.add('delete-btn');

            // 5. Delete button par click event lagao
            deleteBtn.addEventListener('click', function() {
                li.remove(); // Us task ko hata do
            });

            // 6. Delete button ko li ke andar daalo
            li.appendChild(deleteBtn);

            // 7. Poori li ko ul (taskList) mein daalo
            taskList.appendChild(li);

            // 8. Input box ko khaali kar do (taaki agla task likh sako)
            taskInput.value = '';
        });
    </script>

</body>
</html>
